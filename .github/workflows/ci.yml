name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint Templates, Negative Fixtures & Visual Pack QA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Pillow
        run: python3 -m pip install --upgrade pip "Pillow>=10.0"

      - name: Run template house-rule linter
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/lint_claw_template.py --json

      - name: Run end-to-end verifier & negative test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/verify_blobster_factory.py

      - name: Confirm clean git tree (no generated bytecode or unlisted artifacts)
        run: test -z "$(git status --porcelain)"
